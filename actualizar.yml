name: Actualizar noticias

on:
  schedule:
    - cron: "0 5 * * *"     # cada día, 05:00 UTC
    - cron: "0 17 * * *"    # y a las 17:00 UTC
    - cron: "30 7 * * 1"    # los lunes, además, prepara el borrador del resumen semanal
  workflow_dispatch:
    inputs:
      borrador:
        description: "¿Crear también el borrador del resumen semanal?"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: actualizar-noticias
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependencias básicas
        run: pip install -r requirements.txt

      - name: Guardar en caché el modelo de traducción
        uses: actions/cache@v4
        with:
          path: ~/.local/share/argos-translate
          key: argos-en-es-v1

      - name: Instalar traductor (opcional; si falla, la web sigue en el idioma original)
        continue-on-error: true
        run: pip install -r requirements-traduccion.txt

      - name: Comprobar que están los archivos
        run: |
          faltan=""
          for f in build.py feeds.json requirements.txt; do
            [ -f "$f" ] || faltan="$faltan $f"
          done
          if [ -n "$faltan" ]; then
            echo "::error title=Faltan archivos en la raiz del repositorio::$faltan"
            exit 1
          fi
          ls -la

      - name: Descargar noticias, traducir y generar la web
        run: |
          set +e
          python build.py > salida.log 2>&1
          codigo=$?
          cat salida.log
          if [ $codigo -ne 0 ]; then
            echo "::warning::Falló con traducción; reintento sin traducir"
            python build.py --sin-traduccion > salida.log 2>&1
            codigo=$?
            cat salida.log
          fi
          if [ $codigo -ne 0 ]; then
            msg=$(tail -n 12 salida.log | tr -d '\r' | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=build.py fallo (codigo $codigo)::$msg"
            exit 1
          fi

      - name: Guardar cambios
        run: |
          set -e
          trap 'echo "::error title=Fallo al guardar cambios (git)::linea $LINENO"' ERR
          git config user.name "actualizador-noticias"
          git config user.email "actions@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Actualización automática $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi

      - name: Borrador del resumen semanal (te avisa GitHub por correo)
        if: github.event.schedule == '30 7 * * 1' || inputs.borrador == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python build.py --borrador-semanal --borrador borrador.md
          gh issue create --title "Borrador del resumen semanal ($(date -u +%Y-%m-%d))" --body-file borrador.md
